    <main class="content-spacer">
        <div class="container ai-dashboard">
            
            <div class="scanner-section">
                <div class="ai-card">
                    <h2 class="ai-title">Botanix Scanner</h2>
                    
                    <div id="initial-controls">
                        <button type="button" id="start-btn" class="btn-primary" onclick="init()">
                            <i class="fas fa-camera"></i> Open Camera
                        </button>
                        <div class="divider"><span>OR</span></div>
                        <input type="file" id="file-upload" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
                        <button type="button" class="btn-upload" onclick="document.getElementById('file-upload').click()">
                            <i class="fas fa-file-upload"></i> Upload Photo
                        </button>
                    </div>

                    <div id="webcam-container" class="webcam-box" style="display:none;"></div>
                    <div id="capture-container" class="webcam-box" style="display:none;">

                    </div>

                    <div class="button-group">
                        <button type="button" id="capture-btn" class="btn-secondary" onclick="captureAndPredict()" style="display:none;">Analyze Plant</button>
                        <button type="button" id="retake-btn" class="btn-primary" onclick="resetScanner()" style="display:none;">New Scan</button>
                    </div>

                    <div class="reset-wrapper" style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px;">
                        <button type="button" class="btn-hard-reset" onclick="hardReset()">
                            <i class="fas fa-sync-alt"></i> Reset Application

            <div class="info-section">
                <div id="diagnosis-result" class="side-panel">
                    <div class="placeholder-msg">
                        <i class="fas fa-microscope"></i>
                        <p>Waiting for scan... <br>Analysis details will appear here.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "./my_model/";

        // Dictionary for disease descriptions and recommended actions
        const diseaseInfo = {
            "Rice Blast": {
                description: `<b>Symptoms:</b>
                <ul>
                    <li>Spindle-shaped leaf spots with brown or reddish/yellowish-brown margins, ashy centers, and pointed ends are the common symptom.
                    <li>Fully developed lesions normally measure 1.0 -1.5 cm in length and 0.3 -0.5cm in breadth. </li>
                    <li>When nodes are infected, they become black and rot.</li>
                    <li>Infection of panicle base causes rotten neck or neck rot and causes the panicle to fall off. </li>
                    <li>When the infection is severe, secondary branches and grains are also affected resulting in partly filled grains, known as “whiteheads”. </li>
                    <li>Characteristics vary with the crop life stage, susceptibility level of the cultivar and environmental factors. </li>
                </ul><br>`,

                action: `
                <i><b>Within the crop season</b></i>
                <ul>
                    <li>Application of urea in recommended dosages or application of urea based on leaf colour chart.</li>
                    <li>Weed management</li>
                </ul><br>
                
                <i><b>If the disease spread fast, following fungicides could be applied:</b></i>
                <ul>
                    <li>Tebuconazole 250g/l EC – dissolve 10 ml in 16 l of water (8-10 tanks per acre)</li>
                    <li>Isoprothiolane 400g/l EC – dissolve 20 ml in 16 l of water (8-10 tanks per acre)</li>
                    <li>Carbendazim 50% WP/WG – dissolve 11 g/ 11 ml in 16 l of water (8-10 tanks per acre)</li>
                    <li>Tricyclazole 75 %WP – dissolve 10 g in 16 l of water (8-10 tanks per acre)</li>
                </ul><br>

                <i><b>If the crop is infected, following management options should be applied for the next season</b></i>
                <ul>
                    <li>Use of resistant varieties (Bg 403, Bg 406, Bg 366, Bg 359, Bw 361, Bg 250)</li>
                    <li>Use of certified seed paddy free from the disease</li>
                    <li>Addition of burnt paddy husk (250 kg per acre) to the soil during land preparation.</li>
                    <li>Abstain addition of disease infected straw.</li>
                </ul>`
            },

            "Bacterial Leaf Blight": {
                description: `<div style="text-align: right;"><a href="https://doa.gov.lk/rrdi_ricediseases_bacterialleafblight/">doa.gov.lk</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>On seedling stage wilting and yellowing of leaves, or wilting of seedlings (called kresek). Kresek on seedlings may sometimes be confused with early rice stem borer damage. To distinguish kresek symptoms from stem borer damage, Kresek should show yellowish bacterial ooze coming out of the cut ends when leaves squeezed. Unlike plants infested with stem borer, rice plants with kresek are not easily pulled out from soil.</li>
                    <li>On mature plants, lesions usually develop as water-soaked orange stripes on leaf blades or leaf tips. Lesions have a wavy margin and progress toward the leaf base.</li>
                </ul><br>`,
                action: `<b><i>Within the crop season</b></i><br>
                <ul>
                    <li>Application of urea in recommended dosages or application of urea based on leaf colour chart.</li>
                    <li>Ensure good drainage of fields.</li>
                    <li>Immediately after the disease is observed,
                        stop water supply, and let the field dry.</li>
                    <li>When total removal of water is, not possible, try to out-flow water through drainage ditches or water courses (wakkada).</li>
                    <li>Water drained from the fields infected with disease should not be diverted through disease free fields as much as possible.</li>
                    <li>Once the disease is observed, application of potassium fertilizer could manage further spread of the disease.</li>
                </ul>`

            },
            "Brown Spot": {
                description: `<div style="text-align: right;"><a href="https://doa.gov.lk/rrdi_ricediseases_brownspot/">doa.gov.lk</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>The fungus causes brown, circular to oval spots on the coleoptiles which may lead to seedling blight.</li>
                    <li>Seedling blight may cause sparse or inadequate stands and feeble plants.</li>
                    <li>The spots are smaller on young leaves, than on upper leaves.</li>
                    <li>Size and shape of the spots may vary from minute dark (dark brown to reddish brown) spots to large oval to circular spots (having dark brown margin and a light, reddish-brown or gray center). </li>
                    <li>The spots on the leaf sheath and hulls are similar to those on the leaves. </li>
                    <li>When the glumes are infected,  a general black discoloration could be observed.</li>
                    <li>When the immature florets are attacked, grain development might het hindered or kernels that are of light weight or chalky may result. </li>
                </ul><br>`,

                action: `<b><i>Within the crop season</i></b><br>
                    <ul>
                        <li>Application of urea in recommended dosages or application of urea based on leaf colour chart.</li>
                        <li>Weed management</li>
                    </ul><br>
                    
                    <b><i>If the crop is infected, following management options should be applied for the next season</b></i>
                    <ul>
                        <li>Application of organic fertilizer will increase the soil quality</li>
                        <li>Use of certified seed paddy free from the disease</li>
                        <li>Addition of burnt paddy husk (250 kg per acre) to the soil during land preparation.</li>
                        <li>Abstain addition of disease infected straw.</li>
                        <li>Treatment of seed paddy by dipping in hot water (53-54OC) for 10-12 minutes</li>
                        <li>Treatment of seeds with a seed-protectant fungicide</li>
                        <li>Crop rotation</li>
                        <li>Proper land leveling</li>
                    </ul>`
            },
            "Bacterial Wilt": {
                description: `<div style="text-align: right;"><a href="https://www.gardenia.net/disease/bacterial-wilt">gardenia.net</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Wilting of the leaves, often starting at the tips or edges and progressing inward</li>
                    <li>Yellowing or browning of the leaves</li>
                    <li>Stunted growth</li>
                    <li>Water-soaked lesions on the stems or leaves</li>
                    <li>Black or brown discoloration in the stem tissue</li>
                    <li>Sudden death of the plant</li>
                </ul><br>`,

                action: `<ul>
                    <li>Practice crop rotation</li>
                    <li>Remove infected plants</li>
                    <li>Control insects - <i>Control the insects that can spread the bacteria such as Flea Beetles, Leafhoppers</i></li>
                    <li>Apply Barriers - <i>To safeguard young plants, use a floating row cover or cheesecloth to cover them</i></li>
                    <li>Keep the soil moist</li>
                    <li>Use a copper based bactericide</li>
                </ul>`
            },
            "Sheath Blight": {
                description: `<div style="text-align: right;"><a href="https://doa.gov.lk/rrdi_ricediseases_sheathblight/">doa.gov.lk</a></div>
                
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Infection occurs through infected plants or sclerotia which survive in soil for a long time (depending on the temperature and moisture levels). In addition, infected straw, stubble, weeds could be the other sources of primary inoculums. </li>
                    <li>Spots or lesions initially develop near the water level (in flooded fields) or soil (in upland fields) and on the leaf sheath. <li>
                    <li>Spots or lesions might measure 1-3 cm long, may be oval or ellipsoidal initially but may get enlarged and irregular . Mainly on the leaf blade. Lesions are white in the center, banded with green, brown, and orange coloration. </li>
                    <li>At advanced stages, when the flag leaf is infected, panicle exertion is affected.</li>
                    <li>Asexual over-wintering structures known as sclerotia are formed on leaf sheath surface. They are usually 4-5 mm in diameter, white when young, turn brown or purplish brown at maturity and fall off easily on to soil surface and remain for years.</li>
                </ul><br>`,

                action: `<i><b>Within the crop season</b></i>
                <ul>
                    <li>Application of urea in recommended dosages or application of urea based on leaf colour chart.</li>
                    <li>Weed management</li>
                </ul><br>
                
                <i><b>If the disease spread fast, following fungicides could be applied</b></i>
                <ul>
                    <li>Hexconazole 50G/L EC – dissolve 32 ml in 16 l of water (8-10 tanks per acre)</li>
                    <li>Propiconazole 250 G/L EC – dissolve 16 ml in 16 l of water (8-10 tanks per acre)</li>
                    <li>Thiophanate methyl 70% WP – dissolve 16 g in 16 l of water (8-10 tanks per acre)</li>
                    <li>Pencicuron 25% WP – dissolve 32 g in 16 l of water (8-10 tanks per acre)</li>
                    <li>Tebuconazole 250g/l EC – dissolve 10 ml in 16 l of water (8-10 tanks per acre)</li>
                </ul><br>
                
                <i><b>If the crop is infected, following management options should be applied for the next season</b></i>
                <ul>
                    <li>Use of certified seed paddy free from the disease</li>
                    <li>Deep ploughing to bury infested plant residues into the soil</li>
                    <li>Use of recommended seed rate i. e. 2 bushels per acre (direct sowing).</li>
                    <li>Maintaining an average level plant population in the field</li>
                    <li>Addition of burnt paddy husk (250 kg per acre) to the soil during land preparation.</li>
                    <li>Abstain addition of disease infected straw</li>
                </ul><br>
                <b><u>*There are no genetically resistant varieties to this disease. Varieties with clean plant base (less/no unproductive tillers) seem to escape the disease.*</u></b>`
            },

            "Damping-off": {
                description: `<div style="text-align: right;"><a href="https://www.rhs.org.uk/disease/damping-off">rhs.org.uk</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Seedlings may fail to emerge (pre-emergence damping off)</li><br>
                    <li>Seedlings collapse, often submerged in a mass of whitish fungal growth (post-emergence damping off)</li>
                </ul><br>`,

                action: `<ul>
                    <li>Raise seedlings in commercial growing compost, which is usually free of damping off organisms. If home-produced compost must be used, consider steam sterilisation to destroy pathogens</li><br>
                    <li>Ideally, use new pots and trays whenever raising seedlings. If they must be re-used, brush off soil, wash and preferably also treat them with a disinfectant such as Jeyes Fluid. Dry before storage. Never reuse pots and trays in which damping off has been a problem</li><br>
                    <li>Sow seedlings thinly to avoid crowding</li><br>
                    <li>Use mains water if possible when irrigating seedlings grown in pots and trays. If using rainwater, ensure that the water butt is covered to prevent the entry of leaves and other organic debris that could harbour some of the damping off pathogens</li><br>
                    <li>Do not overwater</li>
                    <li>Keep seedlings well ventilated to reduce humidity</li><br>
                    <li>Ensure that both greenhouses and water butts are cleaned regularly. After thoroughly cleaning and refilling rainwater tanks or water butts, add a proprietary water butt cleaner to help prevent problems from both damping off and algae</li>
                </ul>`
            },

            "Anthracnose": {
                description: `<div style="text-align: right;"><a href="https://eos.com/blog/anthracnose/">EOS Data Analytics - eos.com</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Dark, Sunken lesions - Anthracnose blight appears on leaves, stems, and fruits, serving as the primary indicator of infection.</li><br>
                    <li>Spots on the leaves - Initially small, anthracnose leaf spots expand into larger blotches, eventually causing tissue death in affected areas.</li><br>
                    <li>Premature defoliation - Infected plants often shed leaves earlier than normal. This compromises overall plant health.</li><br>
                    <li>Stalk rot - Brown lesions on the stalks’ rind typically appear later in the season. Anthracnose stalk rot can cause plant lodging, decreased harvestability, and lower yield.</li><br>
                    <li>Growth issues - Reduced photosynthesis and nutrient absorption in infected plants can cause them to grow slower.</li><br>
                    <li>Fruit damage - Dark rot spots (both pre- and post-harvest) decrease fruit quality and commercial value.</li><br>
                </ul><br>`,
                
                action: `<ul>
                    <li>Cultivating resistant crop varieties - Select and plant varieties with resistance or tolerance to anthracnose fungal disease.</li><br>
                    <li>Seed management - Use only disease-free seeds and create a second line of defense with fungicide seed treatments. A clean start is half the battle against anthracnose pathogen won.</li><br>
                    <li>Proper plant spacing - Give your plants enough room to breathe. This simple practice helps reduce humidity around the plants — an environment less favorable for fungal growth.</li><br>
                    <li>Root-zone irrigation - Implement drip irrigation instead of overhead watering. This method not only prevents the growth of disease-causing microorganisms, but also reduces the spread of fungal spores through water droplets.</li><br>
                    <li>Field sanitation - Removing infected plant material after harvest eliminates fungal spores’ winter hideouts.</li><br>
                    <li>Crop rotation - Alternating between anthracnose hosts and non-hosts is a smart way to interrupt the transmission of disease. Using EOSDA Crop Monitoring’s Crop rotation feature, you can easily plan and track your rotation schedules for optimal field usage with minimal disease pressure.</li>
                </ul>`
            },

            "Early  Blight": {
                description: `<div style="text-align: right;"><a href="https://agritech.tnau.ac.in/crop_protection/crop_prot_crop%20diseases_veg_potato_2.html">TNAU Agritech Portal</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>It is present in both hills & plains.</li>
                    <li>Brown-black necrotic spot-angular, oval shape characterized by concentric rings.</li>
                    <li>Several spot coalesce & spread all over the leaf.</li>
                    <li>Shot holes on fruits.</li>
                </ul><br>`,

                action: `<ul>
                    <li>Disease free seed tubers should be used for planting.</li>
                    <li>Removal and destruction of infected plant debris should be done because the spores lying in the soil are the primary source of infection.</li>
                    <li>Very early spraying with Zineb or captan 0.2% and repeating it for every 15 – 20 days gives effective control.</li>
                    <li>The variety Kufri Sindhuri possesses a fair degree of resistance.</li>
                </ul>`
            },

            "Late  Blight": {
                description: `<div style="text-align: right;"><a href="https://bioprotectionportal.com/resources/late-blight-causes-symptoms-and-solutions/">BioProtection Portal</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>The disease develops from infected seed or in some instances, direct germination from the resting oospores in the soil (more common in cooler regions). </li><br>
                    <li>The fungal spores and developing lesions are carried from the tuber and will show initially as stem lesions, producing spores at the base of the developing canopy, which can also spread to nearby plants.</li>
                </ul><br>`,

                action: `<ul>
                    <li>Use high-quality seeds and avoid reusing planting material e.g. tubers from a previous year </li><br>
                    <li>Plant late blight-resistant or tolerant varieties </li><br>
                    <li>Keep leaves as dry as possible:  
                        <ul>
                            <li>Space rows to ensure good air circulation </li>
                            <li>Water early in the morning so foliage can dry during the day  </li>
                            <li>Avoid overhead watering </li>
                            <li>Avoid planting in a wet or shaded area </li><br>
                        </ul>
                    </li>
                    <li>Don’t leave any unmonitored plants in the area </li><br>
                    <li>Destroy volunteer plants </li><br>
                    <li>Destroy (or bury) waste (no open cull piles during the growing season)  </li><br>
                    <li>Practice good sanitation: 
                        <ul>
                            <li>Crop rotation to prevent the buildup of the late blight pathogen in the soil </li>
                            <li>Sanitize equipment </li>
                        </ul>
                    </li>
                </ul>`
            },

            "Banana Bunchy Top": {
                description: `<div style="text-align: right;"><a href="https://biologyinsights.com/banana-bunchy-top-virus-symptoms-spread-and-control/">Biology Insights</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Stunted Growth: New leaves look narrow and create a "bunched" or "rosetted" look at the crown.</li><br>
                    <li>Dark Green Streaks: Known as "Morse code" streaks, these appear on leaf stalks (petioles) and midribs.</li><br>
                    <li>J-Hooks: Streaks that curve distinctively as they enter the midrib.</li><br>
                    <li>Leaf Margin Changes: Edges may turn yellow (chlorotic), becoming brittle or wavy.</li><br>
                    <li>Fruit Failure: Severely infected plants rarely fruit; any fruit produced is small, deformed, and inedible.</li><br>
                </ul><br>`,

                action: `<ul>
                    <li>Eradication (Roguing): Identifying and destroying infected plants and their suckers to remove the virus source.</li>
                    <li>Aphid Management: Controlling banana aphids (the primary carriers) through:
                        <ul>
                            <li>Insecticides: Careful application to reduce populations.</li>
                            <li>Biological Control: Using natural enemies of aphids.</li>
                            <li>Clean Planting Material: Using only virus-free suckers or tissue culture plants to prevent the disease from starting in new fields.</li>
                        </ul>
                    </li>
                </ul>`
            },

            "Powdery Mildew": {
                description: `<div style="text-align: right;"><a href="https://extension.psu.edu/powdery-mildew">PennState Extension</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>White Fungal Growth: A powdery white substance appears on the upper surfaces of lower leaves.</li><br>
                    <li>Leaf Distortion: Foliage may become twisted or distorted before eventually wilting and dying.</li><br>
                    <li>Atypical Presentation: On specific plants like Kalanchoe, the fungus may not be obvious; instead, you'll see dry, corky, or scab-like spots.</li>
                </ul><br>`,

                action: `<ul>
                    <li>Environmental Regulation: If favorable conditions persist for 3–6 days, use heat and ventilation in the late afternoon to lower nighttime humidity.</li>
                    <li>Protective Applications: Use labeled fungicides, biological controls, or anti-transpirants.</li>
                    <li>Water Syringing: Since liquid water inhibits spore germination for most powdery mildews, misting leaves during periods of low humidity can prevent infection.</li>
                    <li>Expert Consultation: Contact local agricultural extensions for the most current information on registered fungicides.</li>
                </ul>`
            },
            "Papaya Ring Spot": {
                description: `<div style="text-align: right;"><a href="https://www.apsnet.org/edcenter/pdlessons/Pages/PapayaRingspotvirus.aspx">APSnet</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Leaf Discoloration: Development of prominent mosaic patterns and chlorosis (yellowing) on the leaf lamina.</li><br>
                    <li>Oily Streaks: Water-soaked, dark green oily streaks appear on the petioles and the upper part of the trunk.</li><br>
                    <li>Leaf Distortion: Young leaves become severely distorted, often resulting in a narrow, "shoestring" appearance similar to mite damage.</li><br>
                    <li>Stunted Growth: Trees infected while young remain small and fail to produce a commercially viable crop.</li><br>
                    <li>Fruit Deformity: Fruit may develop bumps (mimicking boron deficiency) and the classic "ringspots" that give the disease its name.</li>
                </ul><br>`,

                action: `<ul>
                    <li>Site Selection: Avoid planting near older, infected orchards or alternative hosts.</li>
                    <li>Roguing: Rapidly identify and remove infected trees to prevent the virus from spreading to healthy neighbors.</li>
                    <li>Cross Protection: Inoculating plants with a mild strain of the virus to immunize them against more severe strains.</li>
                    <li>Genetic Resistance: Utilizing transgenic varieties, like the rainbow papaya, or naturally resistant hybrids.</li>
                    <li>Vector Management: 
                        <ul>
                            <li>Aphid Control: Using reflective mulches (like silver plastic) to disorient aphids and prevent them from landing.</li>
                            <li>Mineral Oil Sprays: Applying stylet oils to the leaves can interfere with the aphid's ability to transmit the virus.</li>
                        </ul>
                    </li>
                    <li>Barrier Cropping: Planting border crops like corn or sorghum around the papaya field to act as a physical buffer that cleans the aphid's mouthparts before they reach the papaya.</li>
                    <li>Strict Sanitation: Ensuring all tools are disinfected and that no infected plant debris remains in the field.</li>
                </ul>`
            },
            "Mosaic  Virus": {
                description: `<div style="text-align: right;"><a href="https://www.almanac.com/pest/mosaic-viruses">Almanac.com</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Mosaic Pattern: Leaves display distinct mottled patches of yellow, white, and green.</li><br>
                    <li>Textural Changes: Surfaces may appear blistered, crinkled, or wavy.</li><br>
                    <li>Stunted Development: Plants exhibit slow growth and overall reduced vigor.</li><br>
                    <li>Severe Deformations: Leaves become twisted or distorted.
                        <ul>
                            <li>CMV Specific: Often causes shoestring syndrome, where leaf blades are so narrow they look like strings.</li>
                            <li>TMV Specific: Characterized by twisted new growth and intense yellowing.</li>
                        </ul>
                    </li><br>
                    <li>Early Detection: Regular inspection is critical to catch these signs before the virus spreads to the rest of your garden.</li>
                </ul><br>`,

                action: `<ul>
                    <li>Immediate Eradication: Remove all infected plants and destroy them immediately.
                        <ul>
                            <li>Never compost infected material; the virus can survive the composting process and reinfect your garden later.</li>
                            <li>Dispose of plants by burning or placing them in the sealed garbage.</li>
                        </ul>
                    </li>
                    <li>Quarantine & Monitoring: Keep a very close eye on "contact plants"—those growing immediately adjacent to the infected specimen.</li>
                    <li>Strict Sanitation:
                        <ul>
                            <li>Disinfect gardening tools after every use.</li>
                            <li>Use a bleach solution or a specialized antiviral spray.</li>
                        </ul>
                    </li>
                </ul>`,
            },
            " Citrus Canker": {
                description: `<div style="text-align: right;"><a href="https://envirevoagritech.com/citrus-canker-disease-treatment-symptoms/">Envirevo Agritech</a></div>
                <b>Symptoms</b><br><br>
                <ul>
                    <li>Early Lesions: Small, slightly raised, spongy spots appear on both sides of newly infected leaves.</li><br>

        let model, webcam, maxPredictions;
        let isStatic = false;
        let animationId; // Crucial for stopping the background loop

        async function loadModel() {
            if (!model) {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                maxPredictions = model.getTotalClasses();
            }
        }

        async function init() {
            try {
                const startBtn = document.getElementById("start-btn");
                startBtn.innerText = "Initializing...";
                startBtn.disabled = true;

                await loadModel();
                
                if (webcam) { await webcam.stop(); }

                webcam = new tmImage.Webcam(250, 250, false);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                
                isStatic = false;
                // Capture the ID so we can kill it when capturing/resetting
                animationId = window.requestAnimationFrame(loop);

                const container = document.getElementById("webcam-container");
                container.innerHTML = ""; 
                container.appendChild(webcam.canvas);
                
                container.style.display = "block";
                document.getElementById("initial-controls").style.display = "none";
                document.getElementById("capture-btn").style.display = "block";
            } catch (err) {
                console.error(err);
                alert("Camera access denied or failed.");
                hardReset();
            }
        }

        async function loop() {
            if (!isStatic && webcam && webcam.canvas) {
                webcam.update();
                animationId = window.requestAnimationFrame(loop);
            }
        }

        async function captureAndPredict() {
            isStatic = true;
            // KILL the loop so the browser stops working in the background
            window.cancelAnimationFrame(animationId); 

            const staticCanvas = document.getElementById("captured-photo");
            const ctx = staticCanvas.getContext("2d");
            staticCanvas.width = webcam.canvas.width;
            staticCanvas.height = webcam.canvas.height;
            ctx.drawImage(webcam.canvas, 0, 0);

            document.getElementById("webcam-container").style.display = "none";
            document.getElementById("capture-container").style.display = "block";
            document.getElementById("capture-btn").style.display = "none";
            document.getElementById("retake-btn").style.display = "block";

            runDiagnosis(staticCanvas);
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            await loadModel();
            if (webcam) { 
                await webcam.stop(); 
                window.cancelAnimationFrame(animationId);
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    isStatic = true;
                    const staticCanvas = document.getElementById("captured-photo");
                    const ctx = staticCanvas.getContext("2d");
                    staticCanvas.width = 250;
                    staticCanvas.height = 250;
                    ctx.drawImage(img, 0, 0, 250, 250);

                    document.getElementById("initial-controls").style.display = "none";
                    document.getElementById("webcam-container").style.display = "none";
                    document.getElementById("capture-container").style.display = "block";
                    document.getElementById("retake-btn").style.display = "block";
                    runDiagnosis(staticCanvas);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 1. Define the categories you want to hide (Names must match exactly what is in Teachable Machine)
        const hiddenClasses = ["HEALTHY Potato", "HEALTHY Coconut", "HEALTHY Carrots", "HEALTHY Rice", "HEALTHY Banana", "HEALTHY Cabbage", "HEALTHY Onion", "People", "HEALTHY Sugarcane", "HEALTHY Pumpkin", "HEALTHY Chilli", "HEALTHY Papaya"]; 

        async function runDiagnosis(source) {
            const resultDiv = document.getElementById("diagnosis-result");
            resultDiv.innerHTML = "<p>Analyzing image...</p>";
            
            const prediction = await model.predict(source);
            let topClass = "";
            let topProb = 0;

            prediction.forEach(p => {
                if (p.probability > topProb) {
                    topProb = p.probability;
                    topClass = p.className;
                }
            });

            if (hiddenClasses.includes(topClass)) {
                resultDiv.innerHTML = `
                    <h2>No Disease Detected !</h2>
                    <div class="confidence-large">100% Normal</div>
                    <p class="detailed-desc">Our AI has analyzed the sample and found no significant traces of disease. <br> Please contact the Botanix team if you are having issues with the AI Model</p>
                `;
                return;
            }

            const info = diseaseInfo[topClass] || { description: "Information pending...", action: "Consult expert." };
            const confidence = (topProb * 100).toFixed(0);

            resultDiv.innerHTML = `
                <h2>${topClass} Detected</h2>
                <div class="confidence-large">${confidence}% AI Match Confidence</div>
                
                <p class="detailed-desc">
                    <strong>About this condition:</strong><br>
                    ${info.description}
                </p>

                <div class="action-box">
                    <h4 style="color: var(--primary-color); margin-bottom: 10px;">Recommended Action Plan:</h4>
                    <p style="font-size: 16px; line-height: 1.6;">${info.action}</p>
                </div>
            `;
        }      
        

        function resetScanner() {
            isStatic = false;
            if (webcam) {
                document.getElementById("webcam-container").style.display = "block";
                document.getElementById("capture-btn").style.display = "block";
                animationId = window.requestAnimationFrame(loop);
            } else {
                document.getElementById("initial-controls").style.display = "block";
            }
            document.getElementById("capture-container").style.display = "none";
            document.getElementById("retake-btn").style.display = "none";
            document.getElementById("diagnosis-result").innerHTML = "";
        }

        async function hardReset() {
            isStatic = false;
            window.cancelAnimationFrame(animationId);
            if (webcam) { await webcam.stop(); webcam = null; }
            
            document.getElementById("initial-controls").style.display = "block";
            document.getElementById("webcam-container").style.display = "none";
            document.getElementById("capture-container").style.display = "none";
            document.getElementById("capture-btn").style.display = "none";
            document.getElementById("retake-btn").style.display = "none";
            document.getElementById("diagnosis-result").innerHTML = `
                <div class="placeholder-msg">
                    <i class="fas fa-microscope"></i>
                    <p>Waiting for scan... <br>Analysis details will appear here.</p>
                </div>
            `;
            document.getElementById("start-btn").innerText = "Start Live Camera";
            document.getElementById("start-btn").disabled = false;
        }
    </script>
